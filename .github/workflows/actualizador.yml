name: Sistema Loterías Chile

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ejecutar-sistema:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Ejecutar Tablero
      run: python tablero.py
