name: Sistema Loterías Chile y Captura

on:
  schedule:
    # Se ejecuta todos los lunes a las 09:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite ejecución manual con un botón

permissions:
  contents: write  # Permiso crucial para que el bot guarde los cambios en los CSV

jobs:
  ejecutar-sistema:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: pip install requests beautifulsoup4 pandas

    - name: Ejecutar Captura Web Semanal
      run: python scripts/scraper.py

    - name: Ejecutar Tablero de Predicciones
      run: python tablero.py

    - name: Guardar y sincronizar cambios automáticamente en GitHub
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'bot@actions.github.com'
        git add datos/
        git commit -m "🤖 Actualización automática semanal: nuevos resultados y tablero" || echo "No hay cambios nuevos para guardar"
        git push
